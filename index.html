<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1f4a">
<link rel="manifest" href="manifest.json">
<title>Memória Duelo</title>
<style>
:root{--bg:#2b1f4a;--back:#ffb703;--face:#fff7e6;--me:#3ddc97;--opp:#ff5d8f;--txt:#fff7e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--txt);font-family:ui-rounded,"Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{width:100%;max-width:420px;margin:auto 0;padding:16px 0;display:flex;flex-direction:column;gap:16px}
h1{font-size:2rem;margin:0;text-align:center}
.tela{display:none;flex-direction:column;gap:14px}
.tela.on{display:flex}
button,input,select{font:inherit;border-radius:14px;border:0;padding:14px;font-size:1.1rem}
button{background:var(--back);color:#2b1f4a;font-weight:700}
button.sec{background:transparent;color:var(--txt);border:2px solid var(--txt)}
input,select{text-align:center;background:var(--face);color:#2b1f4a}
#cod{text-transform:uppercase;letter-spacing:.3em}
.codigo{font-size:3rem;letter-spacing:.2em;text-align:center;font-weight:800;color:var(--back)}
.msg{text-align:center;min-height:1.4em;margin:0}
.nota{text-align:center;font-size:.9rem;opacity:.85;margin:0}
.perfil{text-align:center;font-size:1.2rem;font-weight:700;margin:0}
.dupla{display:flex;gap:10px}
.dupla button{flex:1}
#lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
#lista li{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:14px;background:rgba(255,247,230,.12)}
#lista li.eu{background:var(--back);color:#2b1f4a;font-weight:700}
#som{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:12px;padding:6px 10px;background:transparent;font-size:1.3rem;border:2px solid rgba(255,247,230,.4)}
.placar{display:flex;justify-content:space-between;gap:10px}
.jog{flex:1;padding:10px;border-radius:14px;text-align:center;border:3px solid transparent;opacity:.55;overflow:hidden;font-size:.95rem}
.jog b{display:block;font-size:1.8rem}
.jog.vez{opacity:1;border-color:var(--face)}
#j0{background:var(--me);color:#143}
#j1{background:var(--opp);color:#411}
#grade{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.carta{position:relative;aspect-ratio:1;perspective:600px;border:0;padding:0;background:none}
.carta i{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;transition:transform .35s;font-style:normal}
.carta .costas{background:var(--back);font-size:1.6rem;color:#2b1f4a}
.carta .frente{background:var(--face);font-size:2.4rem;transform:rotateY(180deg)}
.carta.vira .costas{transform:rotateY(180deg)}
.carta.vira .frente{transform:rotateY(0)}
.carta.par .frente{background:#c9f7e0}
@media (prefers-reduced-motion:reduce){.carta i{transition:none}}
</style>
</head>
<body>
<button id="som" aria-label="Som">🔊</button>
<main>
  <h1>Memória Duelo</h1>

  <div id="abas" class="dupla" style="display:none">
    <button id="aJogar">Jogar</button>
    <button id="aRank" class="sec">🏆 Ranking</button>
  </div>

  <section id="carregando" class="tela on">
    <p class="msg">Carregando…</p>
  </section>

  <section id="boas" class="tela">
    <p class="msg">Bem-vindo! Escolha seu nome de jogador:</p>
    <input id="nome" maxlength="12" placeholder="Seu nome" autocomplete="off">
    <p class="nota">Atenção: depois de confirmado, o nome não pode ser trocado.</p>
    <button id="btnNome">Confirmar nome</button>
    <p class="msg" id="msgNome"></p>
  </section>

  <section id="menu" class="tela">
    <p class="perfil" id="perfil"></p>
    <div class="dupla">
      <button id="mCasual">Casual</button>
      <button id="mRank" class="sec">Ranqueada</button>
    </div>
    <select id="tema" aria-label="Tema das cartas"></select>
    <button id="criar">Criar sala</button>
    <input id="cod" maxlength="4" placeholder="CÓDIGO" autocomplete="off">
    <button id="entrar" class="sec">Entrar na sala</button>
    <p class="msg" id="msgMenu"></p>
  </section>

  <section id="ranking" class="tela">
    <ul id="lista"></ul>
    <p class="msg" id="minhaRank"></p>
  </section>

  <section id="espera" class="tela">
    <p class="msg">Passe este código para seu amigo:</p>
    <div class="codigo" id="meuCod">----</div>
    <p class="msg" id="modoEspera"></p>
    <button id="zap">Enviar pelo WhatsApp</button>
    <button id="voltarEspera" class="sec">Voltar</button>
    <p class="msg">Aguardando o outro jogador…</p>
  </section>

  <section id="jogo" class="tela">
    <p class="nota" id="modoTxt"></p>
    <div class="placar">
      <div class="jog" id="j0"><span id="n0"></span><b id="p0">0</b></div>
      <div class="jog" id="j1"><span id="n1"></span><b id="p1">0</b></div>
    </div>
    <p class="msg" id="status"></p>
    <div id="grade"></div>
    <button id="again" class="sec" style="display:none">Jogar de novo</button>
    <button id="sair" class="sec">Sair</button>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(function(){
  var P=window.Peer;
  window.Peer=function(id,o){
    o=o||{};
    o.config={iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
      {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},
      {urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}
    ]};
    return new P(id,o);
  };
})();
  </script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,query,orderBy,limit,getDocs,doc,getDoc,updateDoc,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyAFD48Xmn5tclpfFBf-tRxhs4xa_xKRL1s",
  authDomain:"memoria-duelo.firebaseapp.com",
  projectId:"memoria-duelo",
  storageBucket:"memoria-duelo.firebasestorage.app",
  messagingSenderId:"429570544752",
  appId:"1:429570544752:web:f5a6204e02be0914c350b5"
});
const db=getFirestore(app),auth=getAuth(app);

const TEMAS={
  "Animais":["🐶","🐱","🦊","🐸","🐼","🦁","🐙","🦄"],
  "Frutas":["🍎","🍌","🍇","🍓","🍍","🍉","🍒","🥝"],
  "Esportes":["⚽","🏀","🏈","🎾","🏐","🏓","🥊","🏊"],
  "Bandeiras":["🇧🇷","🇦🇷","🇺🇸","🇯🇵","🇫🇷","🇮🇹","🇩🇪","🇵🇹"]
};
const PAT=[[1000,"👑","Mestre"],[700,"💠","Diamante"],[450,"💎","Platina"],[250,"🥇","Ouro"],[100,"🥈","Prata"],[0,"🥉","Bronze"]];
const pat=p=>PAT.find(x=>p>=x[0]);
const LETRAS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
let peer,conn,eu,deck,vez,viradas,pares,placar,trava,fim,nomes=["",""],top=[],codAtual="";
let uid=null,meu=null,modoSel="casual",modo="casual";

// ---------- sons ----------
let mudo=false,ac;
try{mudo=localStorage.getItem("mudo")==="1"}catch(e){}
function bip(f,t,d,tipo="sine"){
  if(mudo)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;
    o.type=tipo;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.start(s);o.stop(s+d);
  }catch(e){}
}
const som={
  ok:()=>{bip(660,0,.12);bip(880,.12,.18)},
  erro:()=>bip(180,0,.3,"square"),
  ganhou:()=>[523,659,784,1047].forEach((f,i)=>bip(f,i*.12,.2)),
  perdeu:()=>[392,330,262].forEach((f,i)=>bip(f,i*.15,.25))
};
$("som").textContent=mudo?"🔇":"🔊";
$("som").onclick=()=>{
  mudo=!mudo;$("som").textContent=mudo?"🔇":"🔊";
  try{localStorage.setItem("mudo",mudo?"1":"0")}catch(e){}
};

// ---------- telas ----------
function tela(id){
  const a=document.querySelector(".tela.on"),atual=a&&a.id;
  document.querySelectorAll(".tela").forEach(t=>t.classList.toggle("on",t.id===id));
  $("abas").style.display=(id==="menu"||id==="ranking")?"flex":"none";
  $("aJogar").classList.toggle("sec",id!=="menu");
  $("aRank").classList.toggle("sec",id!=="ranking");
  if(id!==atual&&(id==="espera"||id==="jogo"||id==="ranking"))history.pushState({t:id},"");
}
addEventListener("popstate",()=>{
  const t=document.querySelector(".tela.on").id;
  if(t==="jogo"){if(!sair())history.pushState({t:"jogo"},"")}
  else if(t==="espera")voltar();
  else if(t==="ranking")tela("menu");
});

// ---------- conta e perfil ----------
async function iniciarApp(){
  try{
    await new Promise(r=>{const u=onAuthStateChanged(auth,x=>{u();r(x)})});
    if(!auth.currentUser)await signInAnonymously(auth);
    uid=auth.currentUser.uid;
    const s=await getDoc(doc(db,"jogadores",uid));
    if(s.exists())meu=s.data();
  }catch(e){uid=null}
  if(!meu&&!uid){
    try{const n=localStorage.getItem("nomeLocal");if(n)meu={nome:n,slug:slug(n),pontos:0,vitorias:0,sequencia:0,local:true}}catch(e){}
  }
  if(meu){await carregarTop();perfil();tela("menu")}else tela("boas");
}
async function confirmarNome(){
  const n=$("nome").value.trim(),id=slug(n);
  if(n.length<2||id.length<2){$("msgNome").textContent="Use de 2 a 12 letras ou números.";return}
  $("msgNome").textContent="Salvando…";
  if(!uid){
    try{localStorage.setItem("nomeLocal",n)}catch(e){}
    meu={nome:n,slug:id,pontos:0,vitorias:0,sequencia:0,local:true};perfil();tela("menu");return;
  }
  try{
    if((await getDoc(doc(db,"nomes",id))).exists()){$("msgNome").textContent="Esse nome já está em uso. Escolha outro.";return}
    const b=writeBatch(db),p={nome:n,slug:id,pontos:0,vitorias:0,sequencia:0};
    b.set(doc(db,"nomes",id),{uid});
    b.set(doc(db,"jogadores",uid),p);
    await b.commit();
    meu=p;await carregarTop();perfil();tela("menu");
  }catch(e){$("msgNome").textContent="Não foi possível salvar. Confira a internet e tente de novo."}
}
function perfil(){
  const p=pat(meu.pontos);
  $("perfil").textContent=p[1]+" "+meu.nome+" · "+p[2]+" · "+meu.pontos+" pts";
  $("mRank").style.opacity=meu.local?.4:1;
  if(meu.local)modoSel="casual";
  $("mCasual").classList.toggle("sec",modoSel!=="casual");
  $("mRank").classList.toggle("sec",modoSel!=="rank");
}

// ---------- ranking ----------
async function carregarTop(){
  try{
    const s=await getDocs(query(collection(db,"jogadores"),orderBy("pontos","desc"),limit(200)));
    top=s.docs.map(d=>({id:d.id,...d.data()}));
    return true;
  }catch(e){return false}
}
async function registrar(res){
  if(!uid||!meu||meu.local)return;
  try{
    const dp=res==="v"?20:res==="e"?5:-10;
    const n={pontos:Math.max(0,meu.pontos+dp),vitorias:meu.vitorias+(res==="v"?1:0),sequencia:res==="v"?meu.sequencia+1:res==="d"?0:meu.sequencia};
    await updateDoc(doc(db,"jogadores",uid),n);
    Object.assign(meu,n);
  }catch(e){}
}
function etiqueta(nome){
  const i=top.findIndex(r=>r.slug===slug(nome));
  if(i<0)return nome;
  const pos=i+1,seq=top[i].sequencia||0;
  return "#"+pos+(pos<=3?"🏆":"")+" "+nome+(seq>0?" "+seq+"🔥":"");
}
async function mostrarRanking(){
  $("lista").innerHTML="<li>Carregando…</li>";$("minhaRank").textContent="";
  if(!await carregarTop()){$("lista").innerHTML="<li>Não foi possível carregar o ranking.</li>";return}
  const med=["🥇","🥈","🥉"];
  $("lista").innerHTML=top.slice(0,10).map((r,i)=>
    '<li class="'+(r.id===uid?"eu":"")+'"><span>'+(med[i]||(i+1)+".")+" "+esc(r.nome)+(r.id===uid?" (você)":"")+"</span><b>"+pat(r.pontos)[2]+" · "+r.pontos+" pts</b></li>"
  ).join("")||"<li>Ninguém no ranking ainda.</li>";
  const k=top.findIndex(r=>r.id===uid);
  if(k>=10)$("minhaRank").textContent="Sua posição: #"+(k+1);
}

// ---------- utilidades ----------
function sorteia(){
  const e=TEMAS[$("tema").value]||TEMAS["Animais"],d=[...e,...e];
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
  return d;
}
function codigo(){return Array.from({length:4},()=>LETRAS[Math.floor(Math.random()*LETRAS.length)]).join("")}
function fecharConexao(){
  try{conn&&conn.close()}catch(e){}
  try{peer&&peer.destroy()}catch(e){}
  conn=peer=null;
}
function voltar(){fecharConexao();$("msgMenu").textContent="";tela("menu")}
function sair(){
  let p=Promise.resolve();
  if(deck&&!fim){
    if(!confirm("Sair da partida?"+(modo==="rank"?" Conta como derrota.":"")))return false;
    if(modo==="rank")p=registrar("d");
  }
  fim=true;deck=null;fecharConexao();
  $("msgMenu").textContent="";tela("menu");
  p.then(carregarTop).then(perfil);
  return true;
}

// ---------- conexão ----------
function criarSala(){
  fecharConexao();
  const c=codigo();codAtual=c;
  peer=new Peer("memoria-"+c);
  peer.on("open",()=>{
    eu=0;nomes=[meu.nome,""];
    $("meuCod").textContent=c;
    $("modoEspera").textContent=modoSel==="rank"?"Modo: ranqueada":"Modo: casual";
    tela("espera");
  });
  peer.on("error",e=>{if(e.type==="unavailable-id")criarSala();else $("msgMenu").textContent="Erro de conexão. Tente de novo."});
  peer.on("connection",x=>{conn=x;ligar()});
}
function entrarSala(){
  const c=$("cod").value.trim().toUpperCase();
  if(c.length!==4){$("msgMenu").textContent="Digite o código de 4 letras.";return}
  fecharConexao();
  $("msgMenu").textContent="Conectando…";
  peer=new Peer();
  peer.on("open",()=>{
    eu=1;conn=peer.connect("memoria-"+c);ligar();
    conn.on("open",()=>conn.send({t:"hello",nome:meu.nome,rk:!meu.local}));
  });
  peer.on("error",()=>{$("msgMenu").textContent="Sala não encontrada. Confira o código."});
  setTimeout(()=>{
    if(!(conn&&conn.open)&&$("menu").classList.contains("on")){
      fecharConexao();$("msgMenu").textContent="Não conseguiu conectar. Tente de novo.";
    }
  },15000);
}
function ligar(){
  conn.on("data",m=>{
    if(m.t==="hello"&&eu===0){
      nomes=[meu.nome,String(m.nome||"Amigo").slice(0,12)];
      modo=(modoSel==="rank"&&!meu.local&&m.rk)?"rank":"casual";
      iniciar(sorteia(),true);
    }
    else if(m.t==="start"){nomes=m.nomes;modo=m.modo;iniciar(m.deck,false)}
    else if(m.t==="flip")virar(m.i,true);
    else if(m.t==="again"&&eu===0)iniciar(sorteia(),true);
  });
  conn.on("close",()=>{
    if(!deck||fim)return;
    fim=true;
    $("status").textContent=nomes[1-eu]+" saiu da partida.";
    $("again").style.display="none";$("sair").textContent="Voltar ao menu";
    if(modo==="rank")registrar("v").then(carregarTop).then(perfil);
  });
}

// ---------- jogo ----------
function iniciar(d,envia){
  deck=d;vez=0;viradas=[];pares=0;placar=[0,0];trava=false;fim=false;
  if(envia)conn.send({t:"start",deck,nomes,modo});
  const g=$("grade");g.innerHTML="";
  deck.forEach((e,i)=>{
    const b=document.createElement("button");b.className="carta";b.id="c"+i;
    b.innerHTML='<i class="costas">?</i><i class="frente">'+e+'</i>';
    b.onclick=()=>virar(i,false);g.appendChild(b);
  });
  $("again").style.display="none";$("sair").textContent="Sair";
  $("modoTxt").textContent=modo==="rank"?"🏆 Partida ranqueada":"Partida casual";
  tela("jogo");atualiza();
  carregarTop().then(atualiza);
}
function virar(i,remoto){
  if(!deck||fim||trava||viradas.includes(i)||$("c"+i).classList.contains("par"))return;
  if(!remoto&&vez!==eu)return;
  $("c"+i).classList.add("vira");
  if(!remoto)conn.send({t:"flip",i});
  viradas.push(i);
  if(viradas.length===2){trava=true;setTimeout(confere,900)}
}
function confere(){
  if(!deck)return;
  const[a,b]=viradas;
  if(deck[a]===deck[b]){
    [a,b].forEach(i=>$("c"+i).classList.add("par"));
    placar[vez]++;pares++;som.ok();
  }else{
    [a,b].forEach(i=>$("c"+i).classList.remove("vira"));
    vez=1-vez;som.erro();
  }
  viradas=[];trava=false;
  if(pares===deck.length/2)terminar();
  atualiza();
}
function terminar(){
  fim=true;
  const a=placar[eu],b=placar[1-eu],res=a>b?"v":a<b?"d":"e";
  $("status").textContent=(res==="e"?"Empate!":res==="v"?"Você ganhou! 🎉":nomes[1-eu]+" ganhou.")
    +(modo==="rank"?" · "+{v:"+20",e:"+5",d:"-10"}[res]+" pts":"");
  $("again").style.display="block";$("sair").textContent="Voltar ao menu";
  if(res==="v")som.ganhou();else if(res==="d")som.perdeu();
  if(modo==="rank")registrar(res).then(carregarTop).then(()=>{atualiza();perfil()});
}
function atualiza(){
  if(!deck)return;
  $("n0").textContent=etiqueta(nomes[eu]);$("n1").textContent=etiqueta(nomes[1-eu]);
  $("p0").textContent=placar[eu];$("p1").textContent=placar[1-eu];
  $("j0").classList.toggle("vez",vez===eu&&!fim);
  $("j1").classList.toggle("vez",vez!==eu&&!fim);
  if(!fim)$("status").textContent=vez===eu?"Sua vez: vire duas cartas":"Vez de "+nomes[1-eu]+"…";
}

// ---------- botões ----------
Object.keys(TEMAS).forEach(t=>{const o=document.createElement("option");o.value=o.textContent=t;$("tema").appendChild(o)});
$("btnNome").onclick=confirmarNome;
$("mCasual").onclick=()=>{modoSel="casual";perfil()};
$("mRank").onclick=()=>{if(meu&&!meu.local){modoSel="rank";perfil()}};
$("criar").onclick=criarSala;
$("entrar").onclick=entrarSala;
$("again").onclick=()=>{if(eu===0)iniciar(sorteia(),true);else conn.send({t:"again"})};
$("sair").onclick=sair;
$("voltarEspera").onclick=voltar;
$("aJogar").onclick=()=>tela("menu");
$("aRank").onclick=()=>{tela("ranking");mostrarRanking()};
$("zap").onclick=()=>{
  const link=location.origin+location.pathname;
  window.open("https://wa.me/?text="+encodeURIComponent("Vem jogar Memória Duelo comigo! 🧠\nCódigo da sala: "+codAtual+"\n"+link),"_blank");
};
iniciarApp();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
  </html>
